# wrangler.toml — Cloudflare Pages V2 build system reads this automatically
# when present in the repository. Pages projects only recognize a subset of
# Wrangler fields; everything else (especially anything under "unsafe.*") is
# rejected by the Pages validator.
#
# For Pages projects, Cloudflare recommends:
#   - name (optional, matches the Pages project name)
#   - pages_build_output_dir (matches the "Build output directory" field)
#   - compatibility_date / compatibility_flags (optional)
#
# DO NOT add [[unsafe.deployment]] here. That field is Workers-only
# (used by `wrangler pages deploy` CLI). Cloudflare Pages V2 build
# pipeline refused it with:
#   "Configuration file for Pages projects does not support 'unsafe'"
#
# Deployment is handled by Cloudflare Pages directly pulling from the
# connected GitHub repository; no Wrangler deploy step is needed.

name = "home"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"
